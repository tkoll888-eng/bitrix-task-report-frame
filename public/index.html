<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Report Preview</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page">
      <section class="report-shell">
        <div class="toolbar">
          <form class="filters" aria-label="Фильтры отчета">
            <div class="filter-group" data-filter-group="period">
              <label class="filter-field">
                <span class="filter-caption-row">
                  <span>Период</span>
                  <span class="range-inline" data-range-inline="period"></span>
                </span>
                <select data-range-toggle="period">
                  <option value="currentMonth" selected>Текущий месяц</option>
                  <option value="currentWeek">Текущая неделя</option>
                  <option value="today">Сегодня</option>
                  <option value="custom">Произвольный период</option>
                </select>
              </label>
              <div class="range-picker" data-range-picker="period" hidden>
                <input type="date" data-range-start="period" aria-label="Начало периода">
                <span class="range-separator">—</span>
                <input type="date" data-range-end="period" aria-label="Окончание периода">
              </div>
            </div>

            <label class="filter-field">
              <span>Теги содержит</span>
              <div class="tag-input">
                <span class="tag-input-icon">⌂</span>
                <input type="text" value="Любой тег">
              </div>
            </label>

            <div class="filter-group" data-filter-group="completion">
              <label class="filter-field">
                <span class="filter-caption-row">
                  <span>Дата завершения</span>
                  <span class="range-inline" data-range-inline="completion"></span>
                </span>
                <select data-range-toggle="completion">
                  <option value="currentMonth" selected>Текущий месяц</option>
                  <option value="currentWeek">Текущая неделя</option>
                  <option value="today">Сегодня</option>
                  <option value="custom">Произвольный период</option>
                </select>
              </label>
              <div class="range-picker" data-range-picker="completion" hidden>
                <input type="date" data-range-start="completion" aria-label="Начало даты завершения">
                <span class="range-separator">—</span>
                <input type="date" data-range-end="completion" aria-label="Окончание даты завершения">
              </div>
            </div>

            <label class="filter-field">
              <span>Статус</span>
              <select>
                <option>Все статусы</option>
                <option>В работе</option>
                <option>На проверке</option>
                <option>Завершена</option>
              </select>
            </label>
          </form>

          <button type="button" class="print-button">Печать</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Дата создания</th>
                <th>Статус</th>
                <th>Название</th>
                <th>План</th>
                <th>Факт</th>
                <th>Дата завершения</th>
                <th>Крайний срок</th>
                <th>Наим. позиции</th>
                <th>Теги</th>
              </tr>
            </thead>
            <tbody id="report-rows"></tbody>
          </table>
        </div>

        <section class="totals-strip">
          <div class="totals-item">
            <span>Плановые трудозатраты</span>
            <strong id="planned-total">0:00</strong>
          </div>
          <div class="totals-item">
            <span>Затраченное время</span>
            <strong id="spent-total">0:00</strong>
          </div>
          <div class="totals-count">
            <span>Количество задач</span>
            <strong id="task-count">0</strong>
          </div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
