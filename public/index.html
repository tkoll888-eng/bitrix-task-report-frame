<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Report Preview</title>
    <link rel="stylesheet" href="/styles.css?v=20260616-01">
  </head>
  <body>
    <main class="page">
      <section class="report-shell">
        <div class="toolbar">
          <form id="filtersForm" class="filters" aria-label="Фильтры отчета">
            <div class="filter-group" data-filter-group="period">
              <label class="filter-field">
                <span class="filter-caption-row">
                  <span>Период</span>
                  <span class="range-inline" data-range-inline="period"></span>
                </span>
                <select id="periodPreset" data-range-toggle="period">
                  <option value="allTime">За все время</option>
                  <option value="currentMonth" selected>Текущий месяц</option>
                  <option value="previousMonth">Прошлый месяц</option>
                  <option value="currentWeek">Текущая неделя</option>
                  <option value="previousWeek">Прошлая неделя</option>
                  <option value="today">Сегодня</option>
                  <option value="custom">Произвольный период</option>
                </select>
              </label>
              <div class="range-picker" data-range-picker="period" hidden>
                <input type="date" data-range-start="period" aria-label="Начало периода">
                <span class="range-separator">-</span>
                <input type="date" data-range-end="period" aria-label="Окончание периода">
              </div>
            </div>

            <label class="filter-field filter-field-tags">
              <span>Теги</span>
              <div id="tagFilter" class="tag-filter">
                <div class="tag-input tag-picker-input">
                  <span class="tag-input-icon">#</span>
                  <div id="selectedTags" class="tag-selection"></div>
                  <input id="tagSearch" type="text" placeholder="Любой тег" autocomplete="off">
                </div>
                <div id="tagSuggestions" class="tag-suggestions" hidden></div>
                <div id="savedTagSets" class="tag-sets" hidden>
                  <div id="savedTagSetsQuick" class="tag-sets-quick"></div>
                  <details id="savedTagSetsPicker" class="tag-sets-picker">
                    <summary class="tag-sets-summary">Все наборы</summary>
                    <div id="savedTagSetsMenu" class="tag-sets-menu"></div>
                  </details>
                </div>
              </div>
            </label>

            <div class="filter-group" data-filter-group="completion">
              <label class="filter-field">
                <span class="filter-caption-row">
                  <span>Дата завершения</span>
                  <span class="range-inline" data-range-inline="completion"></span>
                </span>
                <select id="completionPreset" data-range-toggle="completion">
                  <option value="allTime" selected>Не учитывать</option>
                  <option value="currentMonth">Текущий месяц</option>
                  <option value="previousMonth">Прошлый месяц</option>
                  <option value="currentWeek">Текущая неделя</option>
                  <option value="previousWeek">Прошлая неделя</option>
                  <option value="today">Сегодня</option>
                  <option value="custom">Произвольный период</option>
                </select>
              </label>
              <div class="range-picker" data-range-picker="completion" hidden>
                <input type="date" data-range-start="completion" aria-label="Начало даты завершения">
                <span class="range-separator">-</span>
                <input type="date" data-range-end="completion" aria-label="Окончание даты завершения">
              </div>
            </div>

            <div class="filter-field filter-field-status">
              <span>Статус</span>
              <details id="statusPicker" class="status-picker">
                <summary id="statusSummary" class="status-picker-summary">Все статусы</summary>
                <div class="status-picker-menu">
                  <div id="statusPresets" class="status-presets">
                    <button type="button" class="status-preset" data-status-preset="work">В работе</button>
                    <button type="button" class="status-preset" data-status-preset="closed">Закрытые</button>
                  </div>
                  <div class="status-options">
                    <label class="status-option">
                      <input type="checkbox" name="statusFilter" value="2" data-label="Ждёт выполнения">
                      <span>Ждёт выполнения</span>
                    </label>
                    <label class="status-option">
                      <input type="checkbox" name="statusFilter" value="3" data-label="Выполняется">
                      <span>Выполняется</span>
                    </label>
                    <label class="status-option">
                      <input type="checkbox" name="statusFilter" value="4" data-label="Ожидает контроля">
                      <span>Ожидает контроля</span>
                    </label>
                    <label class="status-option">
                      <input type="checkbox" name="statusFilter" value="5" data-label="Завершена">
                      <span>Завершена</span>
                    </label>
                    <label class="status-option">
                      <input type="checkbox" name="statusFilter" value="6" data-label="Отложена">
                      <span>Отложена</span>
                    </label>
                    <label class="status-option">
                      <input type="checkbox" name="statusFilter" value="7" data-label="Отклонена">
                      <span>Отклонена</span>
                    </label>
                  </div>
                </div>
              </details>
            </div>
          </form>

          <div class="print-actions">
            <button id="refreshReportButton" type="button" class="print-button">Обновить</button>
            <button id="printButton" type="button" class="print-button">Печать</button>
          </div>
        </div>

        <div id="message" class="message" hidden></div>

        <section id="printMeta" class="print-meta-main" aria-hidden="true"></section>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><button type="button" class="sort-button" data-sort-key="createdDate">Дата создания</button></th>
                <th><button type="button" class="sort-button" data-sort-key="statusLabel">Статус</button></th>
                <th class="title-cell"><button type="button" class="sort-button" data-sort-key="title">Название</button></th>
                <th><button type="button" class="sort-button" data-sort-key="plannedSeconds">План</button></th>
                <th><button type="button" class="sort-button" data-sort-key="spentSeconds">Факт</button></th>
                <th><button type="button" class="sort-button" data-sort-key="closedDate">Дата завершения</button></th>
                <th><button type="button" class="sort-button" data-sort-key="deadline">Крайний срок</button></th>
                <th class="tags-cell"><button type="button" class="sort-button" data-sort-key="tags">Теги</button></th>
              </tr>
            </thead>
            <tbody id="report-rows"></tbody>
          </table>
        </div>

        <nav id="pagination" class="pagination-bar" aria-label="Пагинация задач">
          <div class="pagination-status">
            <span id="pageInfo">Показано 0 из 0</span>
            <span id="pageList">Страницы: 1</span>
          </div>
          <div class="pagination-controls">
            <button id="prevPageButton" type="button" class="pagination-button">Назад</button>
            <button id="nextPageButton" type="button" class="pagination-button">Вперед</button>
            <label class="page-size-field">
              <span>На странице:</span>
              <select id="pageSizeSelect">
                <option value="20" selected>20</option>
                <option value="30">30</option>
                <option value="50">50</option>
              </select>
            </label>
          </div>
        </nav>

        <section class="totals-strip">
          <div class="totals-item">
            <span>Плановые трудозатраты</span>
            <strong id="planned-total">0:00</strong>
          </div>
          <div class="totals-item">
            <span>Затраченное время</span>
            <strong id="spent-total">0:00</strong>
          </div>
          <div class="totals-count">
            <span>Количество задач</span>
            <strong id="task-count">0</strong>
          </div>
        </section>
      </section>
    </main>

    <script src="https://api.bitrix24.com/api/v1/" async></script>
    <script src="/app.js?v=20260616-01"></script>
  </body>
</html>
