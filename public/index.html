<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Report Preview</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page">
      <section class="report-shell">
        <div class="toolbar">
          <form class="filters" aria-label="Фильтры отчета">
            <label class="filter-field">
              <span>Период</span>
              <select>
                <option>Март 2024</option>
                <option>Апрель 2024</option>
                <option>Май 2024</option>
              </select>
            </label>

            <label class="filter-field">
              <span>Теги содержит</span>
              <div class="tag-input">
                <span class="tag-input-icon">⌂</span>
                <input type="text" value="Любой тег">
              </div>
            </label>

            <label class="filter-field">
              <span>Дата завершения</span>
              <select>
                <option>Все</option>
                <option>Сегодня</option>
                <option>Неделя</option>
                <option>Месяц</option>
              </select>
            </label>

            <label class="filter-field">
              <span>Статус</span>
              <select>
                <option>Все статусы</option>
                <option>В работе</option>
                <option>На проверке</option>
                <option>Завершена</option>
              </select>
            </label>
          </form>

          <button type="button" class="print-button">Печать</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Дата создания</th>
                <th>Статус</th>
                <th>Название</th>
                <th>План</th>
                <th>Факт</th>
                <th>Дата завершения</th>
                <th>Крайний срок</th>
                <th>Наим. позиции</th>
                <th>Теги</th>
              </tr>
            </thead>
            <tbody id="report-rows"></tbody>
          </table>
        </div>

        <section class="totals-strip">
          <div class="totals-item">
            <span>Плановые трудозатраты</span>
            <strong id="planned-total">0:00</strong>
          </div>
          <div class="totals-item">
            <span>Затраченное время</span>
            <strong id="spent-total">0:00</strong>
          </div>
          <div class="totals-count">
            <span>Задач: <strong id="task-count">0</strong></span>
          </div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
